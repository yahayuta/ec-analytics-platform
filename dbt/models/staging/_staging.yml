version: 2

models:
  - name: stg_orders
    description: One row per order, deduplicated, with normalised channel and status.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: [marketplace_a, marketplace_b, marketplace_c, own_store]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: [completed, cancelled, returned]

  - name: stg_order_items
    description: One row per order line.
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_customers
    description: One row per customer with a normalised e-mail address.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [unique, not_null]

  - name: stg_products
    description: Product master.
    columns:
      - name: product_id
        tests: [unique, not_null]
